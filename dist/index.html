<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101518">
  <meta name="description" content="卫戍协议同人独立模拟：调配干员、合成精锐、构筑盟约、迎击领袖。">
  <title>卫戍协议 · 联合防卫终端</title>
  <link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./prototype.css">
<link rel="stylesheet" href="./native.css?v=thorn2-alchemy-20260923">
  <style>
    body { margin: 0; background: #0c1013; color: #e8edef; font-family: "Microsoft YaHei", sans-serif; }
    #boot-screen { min-height: 100vh; display: grid; place-content: center; padding: 24px; box-sizing: border-box; }
    #boot-screen h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: 4px; }
    #boot-screen p { color: #a7bac3; line-height: 1.8; max-width: 580px; }
    #boot-error { max-width: 580px; overflow-wrap: anywhere; white-space: pre-wrap; color: #ffb48c; font-size: 13px; }
    #boot-retry { color: #a4e7ed; margin-top: 16px; }
  </style>
  <script>
    window.__garrisonReady = false;
    window.__garrisonBootFailure = function (message) {
      if (window.__garrisonReady) return;
      document.addEventListener('DOMContentLoaded', show, { once: true });
      if (document.readyState !== 'loading') show();
      function show() {
        var status = document.getElementById('boot-status');
        var detail = document.getElementById('boot-error');
        var retry = document.getElementById('boot-retry');
        if (status) status.textContent = '游戏未能完成启动，请刷新页面或检查资源是否完整。';
        if (detail) { detail.hidden = false; detail.textContent = String(message || '启动文件加载失败'); }
        if (retry) retry.hidden = false;
      }
    };
    window.addEventListener('error', function (event) {
      if (event.message) window.__garrisonBootFailure(event.message);
    });
    window.addEventListener('unhandledrejection', function (event) {
      window.__garrisonBootFailure(event.reason && event.reason.message || event.reason);
    });
    window.__garrisonBootTimer = setTimeout(function () {
      window.__garrisonBootFailure('加载超时。请确认 index.html、native.bundle.js、style.css 和 assets 文件夹位于同一目录。');
    }, 60000);
  </script>
  <script defer src="./native.bundle.js?v=thorn2-alchemy-20260923" onerror="window.__garrisonBootFailure('未能加载 native.bundle.js。请完整解压下载的源码包。')"></script>
</head>
<body>
  <section id="boot-screen" role="status" aria-live="polite">
    <h1>卫戍协议<span style="color:#ff6337">.</span></h1>
    <p id="boot-status">正在载入防卫终端……</p>
    <pre id="boot-error" hidden></pre>
    <a id="boot-retry" hidden href="./index.html">重新载入</a>
  </section>
  <div id="app"></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 以运行卫戍协议。</noscript>
</body>
</html>
